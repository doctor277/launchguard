spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 500
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 8
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:6}
  application:
    name: launchguard-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/launchguard}
    username: ${DB_USERNAME:launchguard}
    password: ${DB_PASSWORD:launchguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    postgresql:
      # A transaction-level advisory lock blocks CREATE INDEX CONCURRENTLY.
      transactional-lock: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

launchguard:
  kafka:
    partitions: ${KAFKA_TOPIC_PARTITIONS:6}
  dispatch:
    in-flight-ttl: ${PROBE_IN_FLIGHT_TTL:120s}
  incidents:
    failure-threshold: ${INCIDENT_FAILURE_THRESHOLD:3}
    recovery-threshold: ${INCIDENT_RECOVERY_THRESHOLD:2}
  monitoring:
    interval: ${MONITORING_INTERVAL:30s}
    initial-delay: ${MONITORING_INITIAL_DELAY:30s}
    connect-timeout: ${MONITORING_CONNECT_TIMEOUT:2s}
    response-timeout: ${MONITORING_RESPONSE_TIMEOUT:5s}
