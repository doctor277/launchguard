name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Java 25 and Maven cache
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Docker must be available for real integration tests
        run: docker info
      - name: Pinned Node runtime and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Dashboard component and unit tests
        working-directory: dashboard
        run: npm test
      - name: Dashboard production build and TypeScript validation
        working-directory: dashboard
        run: npm run build
      - name: Compile and test every Maven module (real PostgreSQL and Kafka)
        run: sh ./mvnw -B -ntp clean verify
      - name: Require all modules, integration suites, and zero skipped tests
        shell: pwsh
        run: ./scripts/assert-test-results.ps1
      - name: PowerShell syntax and reporting contract
        shell: pwsh
        run: |
          ./scripts/validate-powershell.ps1
          ./scripts/test-report-deployment.ps1
          ./scripts/demonstrate-ci-failure.ps1
      - name: Workflow lint (pinned tool, includes ShellCheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - name: Terraform formatting and provider-schema validation
        working-directory: infra/terraform/environments/dev
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: TFLint CLI
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v0.64.0
      - name: Terraform static lint
        run: tflint --chdir=infra/terraform/environments/dev --recursive --format compact
      - name: Whitespace validation
        run: git diff --check
      - name: Build metadata
        shell: pwsh
        run: ./scripts/set-build-metadata.ps1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all six application images
        run: docker compose build backend probe-worker payment-service order-service notification-service dashboard
      - name: Install Chromium for real-backend dashboard smoke tests
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Start complete runner-local lab
        run: docker compose up -d --wait --wait-timeout 180
      - name: Register real demo services
        shell: pwsh
        run: ./scripts/register-demo-services.ps1
      - name: Dashboard browser smoke against real Compose backend
        working-directory: dashboard
        run: npm run test:smoke
      - name: Preserve test reports even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/target/surefire-reports/**
            dashboard/test-results/**
          if-no-files-found: warn
          retention-days: 7
      - name: Stop runner-local lab without removing volumes
        if: always()
        run: docker compose down
