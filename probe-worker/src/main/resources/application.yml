spring:
  application:
    name: probe-worker
  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 500
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 8
        max.poll.interval.ms: 300000
    listener:
      observation-enabled: true
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:6}

server:
  port: ${SERVER_PORT:8084}
management:
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    jmx:
      exposure:
        exclude: '*'
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kafka
        liveness:
          include: livenessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: W3C
    export:
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
        schedule-delay: 1s

logging:
  structured:
    format:
      console: logstash
launchguard:
  kafka:
    partitions: ${KAFKA_TOPIC_PARTITIONS:6}
  worker:
    threads: ${PROBE_WORKER_THREADS:4}
    queue-capacity: ${PROBE_WORKER_QUEUE_CAPACITY:64}
    connect-timeout: ${MONITORING_CONNECT_TIMEOUT:2s}
