apiVersion: 1
datasources:
  - name: LaunchGuard Prometheus
    uid: launchguard-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: launchguard-tempo
  - name: LaunchGuard Tempo
    uid: launchguard-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
