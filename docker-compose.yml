x-application-build-args: &application-build-args
  APP_VERSION: ${APP_VERSION:-0.9.0-SNAPSHOT}
  GIT_SHA: ${GIT_SHA:-unknown}
  BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: launchguard
      POSTGRES_USER: launchguard
      POSTGRES_PASSWORD: launchguard
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - launchguard-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U launchguard -d launchguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [database]

  kafka:
    image: apache/kafka:4.3.0@sha256:0be4c9eb3565733612d2836d65636fd611a219ebcf5b4162e5ac259ea0ecb907
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-launchguard}/backend:${IMAGE_TAG:-0.9.0-SNAPSHOT}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: *application-build-args
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/launchguard
      DB_USERNAME: launchguard
      DB_PASSWORD: launchguard
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
      KAFKA_CONSUMER_CONCURRENCY: ${KAFKA_CONSUMER_CONCURRENCY:-6}
      PROBE_IN_FLIGHT_TTL: ${PROBE_IN_FLIGHT_TTL:-120s}
      MONITORING_INTERVAL: ${MONITORING_INTERVAL:-5s}
      MONITORING_INITIAL_DELAY: ${MONITORING_INITIAL_DELAY:-5s}
      MONITORING_CONNECT_TIMEOUT: ${MONITORING_CONNECT_TIMEOUT:-2s}
      MONITORING_RESPONSE_TIMEOUT: ${MONITORING_RESPONSE_TIMEOUT:-5s}
      INCIDENT_FAILURE_THRESHOLD: ${INCIDENT_FAILURE_THRESHOLD:-3}
      INCIDENT_RECOVERY_THRESHOLD: ${INCIDENT_RECOVERY_THRESHOLD:-2}
      OTEL_TRACING_EXPORT_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "127.0.0.1:${LAUNCHGUARD_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [default, database]

  dashboard:
    image: ${IMAGE_PREFIX:-launchguard}/dashboard:${IMAGE_TAG:-0.9.0-SNAPSHOT}
    build:
      context: ./dashboard
      args: *application-build-args
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3001}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  probe-worker:
    image: ${IMAGE_PREFIX:-launchguard}/probe-worker:${IMAGE_TAG:-0.9.0-SNAPSHOT}
    build:
      context: .
      dockerfile: probe-worker/Dockerfile
      args: *application-build-args
    environment:
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
      KAFKA_CONSUMER_CONCURRENCY: ${KAFKA_CONSUMER_CONCURRENCY:-6}
      PROBE_WORKER_THREADS: ${PROBE_WORKER_THREADS:-4}
      PROBE_WORKER_QUEUE_CAPACITY: ${PROBE_WORKER_QUEUE_CAPACITY:-64}
      PROBE_CONNECT_TIMEOUT: ${MONITORING_CONNECT_TIMEOUT:-2s}
      OTEL_TRACING_EXPORT_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "127.0.0.1:${PROBE_WORKER_PORT:-8084}:8084"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "-", "http://127.0.0.1:8084/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  payment-service:
    image: ${IMAGE_PREFIX:-launchguard}/payment-service:${IMAGE_TAG:-0.9.0-SNAPSHOT}
    build:
      context: .
      dockerfile: demo-services/payment-service/Dockerfile
      args: *application-build-args
    environment:
      SERVER_PORT: 8081
      DEMO_SLOW_DELAY_MS: ${PAYMENT_SLOW_DELAY_MS:-2000}
    ports:
      - "127.0.0.1:${PAYMENT_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "-", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  order-service:
    image: ${IMAGE_PREFIX:-launchguard}/order-service:${IMAGE_TAG:-0.9.0-SNAPSHOT}
    build:
      context: .
      dockerfile: demo-services/order-service/Dockerfile
      args: *application-build-args
    environment:
      SERVER_PORT: 8082
      DEMO_SLOW_DELAY_MS: ${ORDER_SLOW_DELAY_MS:-2000}
    ports:
      - "127.0.0.1:${ORDER_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "-", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  notification-service:
    image: ${IMAGE_PREFIX:-launchguard}/notification-service:${IMAGE_TAG:-0.9.0-SNAPSHOT}
    build:
      context: .
      dockerfile: demo-services/notification-service/Dockerfile
      args: *application-build-args
    environment:
      SERVER_PORT: 8083
      DEMO_SLOW_DELAY_MS: ${NOTIFICATION_SLOW_DELAY_MS:-2000}
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "-", "http://127.0.0.1:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
    command: ['-config.file=/etc/tempo.yml']
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
    tmpfs:
      - /tmp/tempo:uid=10001,gid=10001,mode=0770,size=1g
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0@sha256:e7c92c715f28ff142f3bcaccd4fc5603cf4c71276ef09954a38eb4038500a5a5
    command: ['--config=/etc/otelcol/launchguard.yml']
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/launchguard.yml:ro
    depends_on:
      tempo:
        condition: service_started
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - launchguard-prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.11@sha256:3ea272e5cab64a4a62240c682e2c62433b25614d956d44c299a10cb6994f6f2e
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  launchguard-postgres-data:
  launchguard-prometheus-data:

networks:
  database:
